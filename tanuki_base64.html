<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Tanuki Animation</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #f3f3f3;
        font-family: sans-serif;
    }

    /* 隱藏 checkbox */
    #trigger {
        display: none;
    }

    /* 按鈕 */
    label {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 24px;
        background: #ff9f1c;
        color: white;
        border-radius: 10px;
        cursor: pointer;
        font-size: 20px;
        user-select: none;
    }

    /* 狸貓圖片 */
    .tanuki {
        position: fixed;
        top: 0;
        right: 0;
        width: 80px;
        opacity: 0;
        transform-origin: center;
        pointer-events: none;
    }

    /* Checkbox 被按下 → 啟動動畫 */
    #trigger:checked ~ .tanuki {
        animation: moveGrow 4s linear forwards,
                   squish 0.5s ease-in-out infinite alternate;
        opacity: 1;
    }

    /* 主移動 + 變大動畫 */
    @keyframes moveGrow {
        0% {
            top: 0;
            right: 0;
            width: 80px;
            opacity: 1;
        }
        70% {
            top: 60vh;
            right: 60vw;
            width: 600px;
            opacity: 1;
        }
        100% {
            top: 100vh;
            right: 100vw;
            width: 2000px;
            opacity: 0;
        }
    }

    /* Q 彈、Squash & Stretch 效果 */
    @keyframes squish {
        0% {
            transform: scale(1, 1);
        }
        40% {
            transform: scale(1.1, 0.9); /* 寬一點、矮一點 */
        }
        70% {
            transform: scale(0.9, 1.1); /* 窄一點、高一點 */
        }
        100% {
            transform: scale(1, 1);
        }
    }
</style>
</head>
<body>

<!-- Checkbox 用來觸發 CSS 動畫 -->
<input type="checkbox" id="trigger">

<!-- 按鈕 -->
<label for="trigger">召喚狸貓！</label>
