<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
<title>狸狸狸狸狸</title>
<link rel="icon" href="001.png">
<style>
html,body{
0%{
opacity:1;
right:-120px;
top:-120px;
transform:scale(0.2);
}
55%{
opacity:1;
right:50vw;
top:50vh;
transform:translate(50%,50%) scale(1);
}
80%{
opacity:1;
right:50vw;
top:50vh;
transform:translate(50%,50%) scale(6.8);
}
/* 停留 1 秒（保持最大尺寸與可見） */
95%{
opacity:1;
right:50vw;
top:50vh;
transform:translate(50%,50%) scale(6.8);
}
100%{
opacity:0;
right:50vw;
top:50vh;
transform:translate(50%,50%) scale(6.8);
}
}
55%{
opacity:1;
right:50vw;
top:50vh;
transform:translate(50%,50%) scale(1);
}
85%{
opacity:1;
right:50vw;
top:50vh;
transform:translate(50%,50%) scale(6);
}
100%{
opacity:0;
right:50vw;
top:50vh;
transform:translate(50%,50%) scale(6.8);
}
}


@media (max-width:480px){
.tanuki{width:120px}
}
</style>
</head>
<body>


<!-- 兩個 radio，用來交替觸發動畫 -->
<input type="radio" name="play" id="play1">
<input type="radio" name="play" id="play2">


<!-- 底部按鍵（每次點擊都能重播） -->
<div class="control">
<!-- 同一個按鈕位置，實際上有兩個 label 輪流在上層 -->
<label for="play1" class="btn btn1">召喚狸貓</label>
<label for="play2" class="btn btn2">召喚狸貓</label>
</div>


<!-- 狸貓圖片 -->
<img class="tanuki" src="https://s114243-create.github.io/tanuki_site/tanuki.png" alt="狸貓" />


<!--
說明：
- 完全不使用 JavaScript
- 點擊下方按鍵即可觸發動畫
- 每按一次都會重新播放
-->
</body>
</html>
