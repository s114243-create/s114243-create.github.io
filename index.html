<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
<title>狸狸狸狸狸</title>
<link rel="icon" href="001.png">
<style>
html,body{
80% 放大到上下碰到螢幕邊緣
95% 維持 1 秒
100% 消失
*/
@keyframes tanuki-move{
0%{
opacity:1;
right:-140px;
top:-140px;
transform:scale(0.2);
}
55%{
opacity:1;
right:50vw;
top:50vh;
transform:translate(50%,50%) scale(1);
}
80%{
opacity:1;
right:50vw;
top:50vh;
/* scale 8 讓高度接近滿版（依圖片比例） */
transform:translate(50%,50%) scale(8);
}
95%{
opacity:1;
right:50vw;
top:50vh;
transform:translate(50%,50%) scale(8);
}
100%{
opacity:0;
right:50vw;
top:50vh;
transform:translate(50%,50%) scale(8);
}
}


@media (max-width:480px){
.tanuki{width:120px}
}
</style>
</head>
<body>


<!-- radio：交替觸發動畫 -->
<input type="radio" name="play" id="play1">
<input type="radio" name="play" id="play2">


<!-- 底部按鍵（看起來只有一顆，但可以一直按） -->
<div class="control">
<label for="play1" class="btn btn1">召喚狸貓</label>
<label for="play2" class="btn btn2">召喚狸貓</label>
</div>


<!-- 狸貓圖片 -->
<img class="tanuki" src="https://s114243-create.github.io/tanuki_site/tanuki.png" alt="狸貓" />


<!--
條件確認：
✓ 只用 HTML + CSS
✓ 無 JavaScript
✓ 按鍵可重複按
✓ 右上 → 中央 → 放大到上下碰到邊緣
✓ 停留 1 秒 → 消失
-->
</body>
</html>
