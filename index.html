<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>純 CSS 狸貓動畫（按按鈕模擬）</title>
<style>
body {
margin: 0;
background: #101018;
overflow: hidden;
font-family: system-ui, sans-serif;
color: white;
}


/* 讓按鈕固定在畫面下方 */
.btn-wrap {
position: fixed;
bottom: 20px;
left: 50%;
transform: translateX(-50%);
z-index: 20;
}


button {
padding: 12px 26px;
background: rgba(255,255,255,0.12);
color: #fff;
border: 1px solid rgba(255,255,255,0.4);
border-radius: 14px;
font-size: 16px;
cursor: pointer;
backdrop-filter: blur(4px);
}


/* 狸貓圖片 */
.cat {
position: absolute;
width: 200px;
height: 200px;
background-image: url('https://github.com/user-attachments/assets/470b7849-c5a2-4a59-a154-62a642016aac');
background-size: contain;
background-repeat: no-repeat;
background-position: center;
opacity: 0;
animation: none;
}


/* 當 checkbox 被勾選，啟動動畫 */
#run:checked ~ .cat {
animation: move 5s linear infinite;
opacity: 1;
}


/* 從右上變大 → 左下 → 重新開始 */
@keyframes move {
0% {
transform: translate(100vw, -20vh) scale(0.2);
}
80% {
transform: translate(-20vw, 60vh) scale(3.5);
}
100% {
transform: translate(100vw, -20vh) scale(0.2);
}
}


/* 隱藏 checkbox */
#run { display: none; }
</style>
</head>
<body>


<!-- 利用 checkbox 觸發 CSS 動畫 -->
<input type="checkbox" id="run">


<!-- 狸貓本體 -->
<div class="cat"></div>


<!-- 按鈕：點一下切換動畫開始/停止（模擬增加狸貓） -->
<div class="btn-wrap">
<label for="run"><button>按一下開始 / 再按一下停止</button></label>
</div>


</body>
</html>
