<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
<title>狸狸狸狸狸</title>
<link rel="icon" href="001.png">
<style>
 html,body{height:100%;margin:0;font-family:system-ui,'Noto Sans TC',sans-serif;background:linear-gradient(180deg,#f8fafc,#eef2ff);overflow:hidden}


/* 隱藏 checkbox 作為狀態控制 */
#toggle{position:absolute;left:-9999px}


/* 底部按鍵 */
.control{
position:fixed;left:0;right:0;bottom:20px;display:flex;justify-content:center;z-index:50
}
.btn{
background:#4f46e5;color:#fff;padding:14px 22px;border-radius:999px;
box-shadow:0 10px 25px rgba(79,70,229,.35);
cursor:pointer;font-size:16px;user-select:none
}


/* 狸貓初始：在畫面下方、不可見 */
.tanuki{
position:fixed;
left:50%;
bottom:-200px;
transform:translateX(-50%) scale(.8);
max-width:180px;
opacity:0;
pointer-events:none;
filter:drop-shadow(0 10px 24px rgba(0,0,0,.18));
transition:
bottom .6s ease,
opacity .6s ease,
transform .6s ease;
}


/* 點擊按鍵後：狸貓跑到螢幕中央並淡出 */
#toggle:checked ~ .tanuki{
bottom:50vh;
transform:translate(-50%,-50%) scale(.4);
opacity:0;
}


/* 先顯示一瞬間，再淡出（利用 animation-delay 的視覺效果） */
#toggle:checked ~ .tanuki{
animation:flash .8s ease forwards;
}


@keyframes flash{
0%{opacity:0;bottom:-200px}
20%{opacity:1;bottom:120px}
100%{opacity:0;bottom:50vh}
}
</style>
</head>
<body>
<!-- 狀態控制（不顯示） -->
<input type="checkbox" id="toggle" />


<!-- 底部控制按鍵 -->
<div class="control">
<label for="toggle" class="btn">召喚狸貓</label>
</div>


<!-- 狸貓圖片 -->
<img class="tanuki" src="https://raw.githubusercontent.com/s114243-create/s114243-create.github.io/main/%E8%9E%A2%E5%B9%95%E6%93%B7%E5%8F%96%E7%95%AB%E9%9D%A2%202025-12-04%20155700.png" alt="狸貓" />


<!--
說明：
- 完全不使用 JavaScript
- 點擊下方按鍵 → 狸貓從畫面下方出現 → 跑到螢幕中央 → 立刻消失
- 若要每次都能重新觸發，可改用 radio + 重置按鍵，我也可以幫你調整
</body>
</html>
