<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Tanuki Animation</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #f3f3f3;
        font-family: sans-serif;
    }

    /* 隱藏 checkbox */
    #trigger {
        display: none;
    }

    /* 按鈕 */
    label {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 24px;
        background: #ff9f1c;
        color: white;
        border-radius: 10px;
        cursor: pointer;
        font-size: 20px;
        user-select: none;
    }

    /* 狸貓圖片本體 */
    .tanuki {
        position: fixed;
        top: 0;
        right: 0;
        width: 80px;
        opacity: 0;
        pointer-events: none; 
    }

    /* 觸發動畫（checkbox 被按下時） */
    #trigger:checked ~ .tanuki {
        animation: moveGrow 4s linear forwards;
        opacity: 1;
    }

    /* 狸貓動畫：從右上 → 左下 & 變大到滿版 */
    @keyframes moveGrow {
        0% {
            top: 0;
            right: 0;
            width: 80px;
            opacity: 1;
        }
        70% {
            top: 60vh;
            right: 60vw;
            width: 600px;
            opacity: 1;
        }
        100% {
            top: 100vh;
            right: 100vw;
            width: 2000px; /* 足以填滿整個螢幕 */
            opacity: 0; /* 到最大後消失 */
        }
    }
</style>
</head>
<body>

<!-- checkbox 用來觸發 CSS 動畫 -->
<input type="checkbox" id="trigger">

<!-- 按鈕 -->
<label for="trigger">召喚狸貓！</label>

<!-- 狸貓圖片 -->
<img class="tanuki" src="https://lurl.cc/C0Xsq">

</body>
</html>
