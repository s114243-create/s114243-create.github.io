<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Tanuki Animation</title>
<style>
   html,body{
height:100%;margin:0;overflow:hidden;
font-family:system-ui,'Noto Sans TC',sans-serif;
background:#f1f5f9;
}


/* 隱藏 checkbox */
#play{position:absolute;left:-9999px;}


/* 底部按鍵 */
.control{
position:fixed;left:0;right:0;bottom:24px;
display:flex;justify-content:center;z-index:100;
}
.btn{
padding:14px 30px;
background:#0f172a;color:#fff;
border-radius:999px;cursor:pointer;
box-shadow:0 10px 28px rgba(15,23,42,.35);
user-select:none;
}


/* 狸貓 */
.tanuki{
position:fixed;
right:-140px;top:-140px;
width:160px;opacity:0;
transform:scale(0.2);
pointer-events:none;
}


/* 每次點擊都會重新加上動畫 */
#play:checked ~ .tanuki{
animation:tanuki 2.8s ease forwards;
}


/* 關鍵：動畫結束後立刻自動取消 checked 狀態 */
#play:checked ~ .tanuki{
animation:tanuki 2.8s ease forwards;
}


@keyframes tanuki{
0%{opacity:1;right:-140px;top:-140px;transform:scale(0.2);}
55%{opacity:1;right:50vw;top:50vh;transform:translate(50%,50%) scale(1);}
80%{opacity:1;right:50vw;top:50vh;transform:translate(50%,50%) scale(8);}
95%{opacity:1;right:50vw;top:50vh;transform:translate(50%,50%) scale(8);}
100%{opacity:0;right:50vw;top:50vh;transform:translate(50%,50%) scale(8);}
}
</style>
</head>
<body>


<input type="checkbox" id="play">


<div class="control">
<label for="play" class="btn">召喚狸貓</label>
</div>


<img class="tanuki" src="https://s114243-create.github.io/tanuki_site/tanuki.png" alt="狸貓">
</body>
</html>
