<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>純 CSS 狸貓動畫（按按鈕重播）</title>
<style>
body {
margin: 0;
background: #0f0f18;
overflow: hidden;
font-family: system-ui, sans-serif;
color: white;
}


/* --- 固定在下方的按鈕 --- */
.btn-wrap {
position: fixed;
bottom: 20px;
left: 50%;
transform: translateX(-50%);
z-index: 20;
}


button {
padding: 12px 26px;
background: rgba(255,255,255,0.12);
color: #fff;
border: 1px solid rgba(255,255,255,0.4);
border-radius: 14px;
font-size: 16px;
cursor: pointer;
backdrop-filter: blur(4px);
}


/* 隱藏 checkbox */
#toggle { display: none; }


/* 狸貓圖片 */
.cat {
position: absolute;
width: 200px;
height: 200px;
background-image: url('https://github.com/user-attachments/assets/470b7849-c5a2-4a59-a154-62a642016aac');
background-size: contain;
background-repeat: no-repeat;
background-position: center;
opacity: 0;
animation: none;
}


/* 每次按按鈕 → 啟動動畫（重播） */
#toggle:checked ~ .cat {
animation: move 5s linear;
opacity: 1;
}


/* --- 從右上變大 → 左下 → 消失 --- */
@keyframes move {
0% {
transform: translate(100vw, -20vh) scale(0.2);
opacity: 1;
}
80% {
transform: translate(-20vw, 60vh) scale(3.5);
opacity: 1;
}
100% {
transform: translate(-20vw, 60vh) scale(4);
opacity: 0; /* 滿螢幕後消失 */
}
}
</style>
</head>
<body>


<!-- 利用 checkbox 重新啟動動畫 -->
<input type="checkbox" id="toggle">


<!-- 狸貓本體 -->
<div class="cat"></div>


<!-- 按鈕（每按一次 = 重播動畫） -->
<div class="btn-wrap">
<label for="toggle"><button onclick="this.blur()">按一下出現狸貓</button></label>
</div>


</body>
</html>
