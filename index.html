/* 觸發動畫：出現 + 移動 + 變大 */
#toggle:checked ~ .tanuki {
    animation: moveScale 3.8s linear forwards;
    opacity: 1;
}

@keyframes moveScale {
    0% {
        transform: translate(0, 0) scale(0.2);
    }
    100% {
        transform: translate(-120vw, 120vh) scale(6);
    }
}

/* 按鈕 */
label {
    width: 100%;
    padding: 20px;
    background: #d39c53;
    font-size: 24px;
    text-align: center;
    cursor: pointer;
    color: white;
    font-weight: bold;
}
</style>
